server:
  port: 30110

spring:
  application:
    name: work-order-base

  config:
    import:
      - nacos:work-order-base.yaml

  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
      config:
        server-addr: 127.0.0.1:8848
        file-extension: yaml
        namespace: public
        group: DEFAULT_GROUP